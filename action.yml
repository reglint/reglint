name: "RegLint"
description: "Run RegLint regex scans with YAML-defined rules, SARIF output, and CI-friendly exit codes."
branding:
  icon: "search"
  color: "blue"

inputs:
  version:
    description: "RegLint version to install (e.g. v0.1.0)."
    required: false
    default: "latest"
  config:
    description: "Path to the YAML rules config file."
    required: false
    default: "reglint-rules.yaml"
  paths:
    description: "Paths to scan (space-separated)."
    required: false
    default: "."
  fail-on:
    description: "Fail if matches at or above severity (error or warning)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install RegLint
      shell: bash
      env:
        REGLINT_VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$REGLINT_VERSION" ] || [ "$REGLINT_VERSION" = "latest" ]; then
          unset REGLINT_VERSION
        fi
        curl -fsSL "https://raw.githubusercontent.com/iyaki/reglint/${{ github.action_ref }}/install.sh" | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run RegLint
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        PATHS: ${{ inputs.paths }}
      run: |
        args=""
        if [ -n "$FAIL_ON" ]; then
          args="$args --fail-on $FAIL_ON"
        fi
        # $args and $PATHS are intentionally word-split.
        reglint analyze --config "$CONFIG" $args $PATHS
