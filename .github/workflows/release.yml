name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "~1.25.8"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.15.1"
          args: >-
            ${{ github.event_name == 'workflow_dispatch'
                && 'release --snapshot --clean'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Smoke test install script
        if: github.event_name == 'push'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" | REGLINT_VERSION="${{ github.ref_name }}" sh
          want="${GITHUB_REF_NAME#v}"
          "$HOME/.local/bin/reglint" version | grep -F " $want"
