name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read

jobs:
  e2e-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          go-hash: ${{ hashFiles('go.sum') }}
          tools-hash: ${{ hashFiles('scripts/install-go-tools.sh') }}
      - name: e2e smoke
        if: ${{ hashFiles('**/*.go') != '' }}
        run: devenv shell -- make test-e2e-smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "~1.25.8"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          go-hash: ${{ hashFiles('go.sum') }}
          tools-hash: ${{ hashFiles('scripts/install-go-tools.sh') }}
      - name: arch
        if: ${{ hashFiles('**/*.go') != '' }}
        run: devenv shell -- make arch

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          go-hash: ${{ hashFiles('go.sum') }}
          tools-hash: ${{ hashFiles('scripts/install-go-tools.sh') }}
      - name: mutation
        if: ${{ hashFiles('**/*.go') != '' }}
        run: devenv shell -- make mutation

  reglint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          go-hash: ${{ hashFiles('go.sum') }}
          tools-hash: ${{ hashFiles('scripts/install-go-tools.sh') }}
      - name: self-scan
        run: devenv shell -- make scan
