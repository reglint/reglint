name: e2e-full

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          go-hash: ${{ hashFiles('go.sum') }}
          tools-hash: ${{ hashFiles('scripts/install-go-tools.sh') }}
      - name: e2e full matrix
        if: ${{ hashFiles('**/*.go') != '' }}
        run: devenv shell -- make test-e2e
