version: 2
project_name: reglint

before:
  hooks:
    - go mod tidy

builds:
  - id: reglint
    main: ./cmd/reglint
    binary: reglint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/reglint/reglint/internal/cli.version={{ .Version }}

archives:
  - id: reglint
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: reglint
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/reglint/reglint"
    description: "Configurable regex scanner with SARIF output and CI-friendly exit codes."
    license: "MIT"
    install: |
      bin.install "reglint"
    test: |
      system "#{bin}/reglint version"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^refactor:"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
